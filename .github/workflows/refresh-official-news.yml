name: Refresh official news calendar
on:
  push:
    paths:
      - 'update-official-news.py'
      - '.github/workflows/refresh-official-news.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read BLS release calendar
        run: python update-official-news.py
      - name: Publish refreshed feed when changed
        run: |
          if ! git diff --quiet -- official-news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add official-news.json
            git commit -m "Refresh official BLS news calendar"
            git push
          fi
